name: E2E

on:
  push:
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Real Postgres for the real backend. Local dev credentials only, the same
    # values docker-compose.yml uses. No repository secrets are needed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: subflow
          POSTGRES_PASSWORD: subflow_dev
          POSTGRES_DB: subflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U subflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      DATABASE_URL: postgresql://subflow:subflow_dev@localhost:5432/subflow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install backend
        run: npm ci
        working-directory: backend

      - name: Install frontend
        run: npm ci
        working-directory: frontend

      - name: Install e2e
        run: npm ci
        working-directory: e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: e2e

      # playwright.config.ts starts the backend (schema push + admin seed) and
      # the Vite dev server, then runs every test in Chromium, Firefox and WebKit.
      - name: Run Playwright tests
        run: npx playwright test
        working-directory: e2e

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: e2e/test-results/
          retention-days: 14
